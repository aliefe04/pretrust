name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run test suite
        run: cargo test --all-targets --locked

  lint:
    name: Format and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Validate Action scripts
        run: |
          bash -n scripts/pretrust-action.sh scripts/pretrust-comment.sh scripts/test-comment-selection.sh
          bash scripts/test-comment-selection.sh
      - name: Check for token fixture literals
        run: |
          status=0
          git grep -I -q -E 'ghp_[A-Za-z0-9]{36}' -- . || status=$?
          if [ "$status" -eq 1 ]; then
            exit 0
          elif [ "$status" -eq 0 ]; then
            echo "Forbidden token-shaped fixture literal detected in tracked files" >&2
            exit 1
          else
            echo "git grep failed unexpectedly with exit code $status" >&2
            exit "$status"
          fi

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - name: Check on minimum supported Rust version
        run: cargo check --workspace --all-targets --locked
