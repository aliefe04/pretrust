[package]
name = "pretrust"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Check what an AI coding agent is about to execute from a repository, before it executes it"
readme = "../../README.md"
keywords = ["ai", "security", "mcp", "supply-chain", "static-analysis"]
